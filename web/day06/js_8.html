<body>
    <input type="button" value="按钮" onclick="doMul(10,20)">
    <script>
        function print() {
            console.log("hello js");

        function add(x, y) {//形参
            console.log(x + y);

        function mul(x, y) {
            return x * y;
        }
        function doMul(x, y) {
            let a = mul(x, y);
            console.log(a);
        }
        
    </script>
