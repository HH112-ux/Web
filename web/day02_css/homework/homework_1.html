<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .out{
            width: 300px;
            height: 420px;
            /* border: 1px solid red; */
            font-weight: bold;
            /*调整阴影效果*/
            box-shadow: 15px 15px 20px rgba(255, 0, 21, 0.575);
        }
        .top{
            height: 270px;
            /* border: 1px solid blue; */
            background-color: brown;
            color:#ffffff;
        }
        .bottom{
            height: 150px;
            background-color: #cdcdcd;
            /* border: 1px solid rgb(0, 255, 42); */
        }
        .x{
            text-align: center;
            font-size: 40px;
            line-height: 120px;
        }
        .y{
            /* border:1px solid blue; */
            width: 280px;
        }
        li{
            list-style: none;
            text-align: right;
            line-height: 30px;
            font-size: 20px;
        }
        .a{
            color: brown;
            line-height: 90px;
            font-size: 20px;
            text-indent: 10px;
            height: 50px;
            
        }
        .b{
            font-size: 20px;
            color: #8107e6;
            line-height: 15px;
            text-indent: 35px;
            height: 60px;
        }
        .c{
            width: 280px;
            color: brown;
            text-align: right;

        }
    </style>
</head>
<body>
    <div class="out">
        <div class="top">
            <div class="x">小红书</div>
            <div class="y">
                <ul>
                    <li>HOME</li>
                    <li>DESIGN</li>
                    <li>WEEK</li>
                    <li>SHANGHAI</li>
                </ul>
            </div>
        </div>
        <div class="bottom">
            <div class="a">上海家居设计周</div>
            <div class="b">上海浦东新区国展路1099号</div>
            <div class="c">RED BOOK</div>
        </div>
    </div>
</body>
</html>
