<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        fieldset{
            width: 300px;
            margin: 0 auto;
            text-align: center;
            border-radius: 5px;
            border-color: red;
        }
        legend{
            text-align: center;
        }
    </style>
</head>

<body>
    <form>
        <fieldset>
            <legend>个人信息</legend>
            <div>姓名:<input type="text"></div>
            <div>年龄:<input type="number"></div>
            <div>学校:<input type="text"></div>
            <div>证件:<input type="text"></div>
        </fieldset>
        <br>
        <br>
        <fieldset>
            <legend>教育信息</legend>
            <div>专业:<input type="text"></div>
            <div>院校:<input type="number"></div>
            <div>学位:<input type="text"></div>
            <div>学历:<input type="text"></div>
        </fieldset>
    </form>
</body>

</html>
