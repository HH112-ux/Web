<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        textarea {
            width: 300px;
            height: 200px;
        }
    </style>
</head>

<body>
    <div>聊天室</div>
    <div><textarea id="c"></textarea></div>
    <div>
        <input type="checkbox" onclick="autoClear(this)">自动清除
    </div>
    <div><input type="text" id="a">
        <button type="button" onclick="doSend()">发送</button>
    </div>
    <script>
        let e;
        function doSend(){
            let v1=document.getElementById("a").value;
            document.getElementById("c").value+=v1+"\n";
            document.getElementById("a").value="";
        }
        function autoClear(obj){
            let b=obj.checked;
            if (b){
                e=setInterval(()=>{document.getElementById("c").value=""},"5000");
            }else{
                clearInterval(e);
            }
        }
        /* function doClear(){
            document.getElementById("c").value="";
        } */
    </script>
</body>

</html>
