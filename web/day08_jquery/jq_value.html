<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="v" placeholder="请输入姓名">
    <input type="text" id="idnum" placeholder="请输入身份证">
    <input type="text" id="age" placeholder="请输入年龄">
    <script src="jquery-3.6.4.min.js"></script>
    <script>
        $(function(){
            $("#v").blur(function(){
                //获取控件值
                let value=$(this).val();
                if (value=="")
                    alert("姓名不能为空")
            })
            $("#idnum").blur(function(){
                //334455199912093644
                let value=$(this).val();
                let y=parseInt(value.substring(6,10));
                let d=new Date();
                let cy=d.getFullYear();
                let x=cy-y;
                //赋值操作
                $("#age").val(x);
            })
        })
    </script>
</body>
</html>
