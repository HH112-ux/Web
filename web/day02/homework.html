<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Day02 作业</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #fff;
            padding: 40px;
        }

        .section {
            margin-bottom: 50px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 40px;
        }

        h2 {
            color: #333;
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 2px solid #0066cc;
        }

        .cover {
            width: 300px;
            height: 500px;
            margin-bottom: 40px;
        }

        .cover .top {
            width: 100%;
            height: 300px;
            background: #c41e3a;
            color: #fff;
            position: relative;
        }


        .cover .subtitle {
            font-size: 22px;
            line-height: 1.4;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: absolute;
            bottom: 50px;
            right: 30px;
            text-align: right;
        }

        .cover .bottom {
            height: 150px;
            background: #e0e0e0;
            position: relative;
        }

        .cover .address {
            position: absolute;
            top: 50px;
            left: 30px;
            line-height: 1.3;
        }

        .cover .address .city {
            color: brown;
            line-height: 90px;
            font-size: 20px;
            text-indent: 10px;
            height: 50px;
        }

        .cover .address .location {
            font-size: 20px;
            color: #8107e6;
            line-height: 15px;
            text-indent: 40px;
            height: 60px;
            position: relative;
            top: -45px;
            
        }

        .cover .redbook {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 14px;
            color: #8b4513;
            font-weight: normal;
            text-transform: uppercase;
        }

        .nav-menu {
            width: 150px;
            background: #f0f0f0;
            padding: 0;
            border-radius: 0;
        }

        .nav-menu ul {
            list-style: none;
        }

        .nav-menu li {
            margin-bottom: 0;
        }

        .nav-menu a {
            display: block;
            height: 46px;
            line-height: 46px;
            padding: 0 20px;
            text-decoration: none;
            color: #fff;
            font-size: 16px;
            font-weight: 400;
            background: #005691;
            border-radius: 0;
            transition: background .3s;
        }

        .nav-menu a:hover {
            background: #e69a28;
            color: #fff;
        }
    </style>
</head>
<body>
    <h1>Day02 作业</h1>

    <div class="section">
        <h2>小红书封面</h2>
        <div class="cover">
            <div class="top">
                <h1>小红书</h1>
                <div class="subtitle">HOME<br>DESIGN<br>WEEK<br>SHANGHAI</div>
            </div>
            <div class="bottom">
                <div class="address">
                    <span class="city">上海家居设计周</span><br>
                    <span class="location">上海浦东新区国展路1099号</span>
                </div>
                <div class="redbook">RED BOOK</div>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>导航菜单</h2>
        <div class="nav-menu">
            <ul>
                <li><a href="#">用户管理</a></li>
                <li><a href="#">房间管理</a></li>
                <li><a href="#">房型管理</a></li>
                <li><a href="#">商品管理</a></li>
                <li><a href="#">会员管理</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
