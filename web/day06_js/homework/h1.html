<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let str="";
        for (let x=1;x<=9;x++){
            for (let y=1;y<=x;y++){
                str+=y+"*"+x+"="+y*x+"&nbsp;&nbsp;&nbsp;&nbsp;";
            }
            str+="<br>";
        }
        document.write(str);
    </script>
</body>
</html>
