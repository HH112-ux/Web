<body>
    <script>
        let arrs = [23, 21, 4, 16, 8, 25];
        for (let i = 0; i < arrs.length; i++) {
            for (let j = 0; j < arrs.length - 1 - i; j++) {
                if (arrs[j] > arrs[j + 1]) {
                    let t = arrs[j];
                    arrs[j] = arrs[j + 1];
                    arrs[j + 1] = t;
                }
            }
        }
        for (let x of arrs)
            console.log(x);
        /* console.log(arrs); */
    </script>
</body>
