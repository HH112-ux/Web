<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .x{
            width: 100px;
            height: 100px;
            background-color: red;
            position: absolute;
            left: 50px;
            top:50px;
        }
        .y{
            width: 200px;
            height: 200px;
            border: 1px solid blue;
             position: relative;
            left: 200px; 
        }
        .z{
            width: 100px;
            height: 100px;
            background-color: yellow;
            position: absolute;
            right: 30px;
            top: 30px;
        }
    </style>
</head>
<body>
    <div class="y">
        <div class="x"></div>
        <div class="z"></div>
    </div>
</body>
</html>
