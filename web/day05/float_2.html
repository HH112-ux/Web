<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
        }
        .t1{
            height: 100px;
            background-color: antiquewhite;
        }
        .t2{
            height: 80px;
            background-color: aquamarine;
            width: 80%;
            float: left;
        }
        .t3{
            height: 80px;
            background-color: blueviolet;
            width: 20%;
            float: left;
        }
        .t4{
            height: 220px;
            background-color: blue;
            width: 30%;
            float: left;
        }
        .t5{
            height: 220px;
            background-color: rgb(255, 145, 0);
            width: 40%;
            float: left;
        }
        .t6{
            height: 220px;
            background-color: rgb(0, 255, 128);
            width: 30%;
            float: left;
        }
        .t7{
            height: 100px;
            background-color: crimson;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="t1"></div>
    <div class="t2"></div>
    <div class="t3"></div>
    <div class="t4"></div>
    <div class="t5"></div>
    <div class="t6"></div>
    <div class="t7"></div>
</body>
</html>
