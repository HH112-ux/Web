<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 100px;
            height: 100px;
        }
        .x{
            background-color: red;
        }
        .y{
            background-color: blue;
            position: relative;
            left:50px;/*表示相对于原来位置的左外边界右移的距离*/
            /* top:-50px */
            bottom: 50px;
        }
        .z{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <div class="x"></div>
    <div class="y"></div>
    <div class="z"></div>
</body>
</html>
