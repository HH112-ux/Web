<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            height: 100px;
            width: 100px;
        }

        .x {
            background-color: red;
        }

        .y {
            background-color: blue;
            position: absolute;
            left:50px;
            top:50px;
        }

        .z {
            background-color: yellow;
        }
    </style>
</head>

<body>
    <div class="x"></div>
    <div class="y"></div>
    <div class="z"></div>
</body>

</html>
