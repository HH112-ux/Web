<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 200px;
            height: 200px;
            border: 3px solid #000;
            font-size: 30px;
            margin-top: 10px;
        }
        .color {
            background-color: blue;
        }
        .big {
            width: 300px;
            height: 300px;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 对象的写法: 在当前的div上激活color big的类样式 -->
        <div class="box" :class="{color:true,big:true}"></div>

        <!-- 数组的写法: 在当前的div上激活color big的类样式 -->
        <div class="box" :class="['color','big']"></div>
    </div>
</body>
<script src="js/vue.js"></script>
<script>
   const vue = new Vue({
      el:"#app",
      data:{
       
      },
      
   })
</script>
</html>
