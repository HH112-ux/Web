<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
          border: 1px solid #000;
          text-align: center;
          width: 240px;
        }
        th,td {
          border: 1px solid #000;
        }
        h3 {
          position: relative;
        }
      </style>
</head>
<body>
    <div id="app">
          <h3>商品清单</h3>
          <h3>商品的总数量: <span>{{ getTotalCount() }}</span></h3>
          <h3>商品的总数量: <span>{{ getTotalCount() }}</span></h3>
          <h3>商品的总数量: <span>{{ getTotalCount() }}</span></h3>
          <h3>商品的总数量: <span>{{ getTotalCount() }}</span></h3>
          <h3>商品的总数量: <span>{{ getTotalCount() }}</span></h3>
          <table>
                <tr>
                    <th>商品名称</th>
                    <th>商品数量</th>
                </tr>
                <tr v-for="(item,index) in list" :key="item.id">
                    <td>{{ item.name }}</td>
                    <td>{{ item.num }}</td>
                </tr>
          </table>
          <p>商品总数量: {{ getTotalCount() }}</p>
    </div>
</body>
<script src="js/vue.js"></script>
<script>
     const vue = new Vue({
        el:"#app",
        data:{
            list:[
                {id:1,name:'篮球',num:1},
                {id:2,name:'足球',num:3},
                {id:3,name:'乒乓球',num:5},
            ]
        },
       methods:{
          getTotalCount(){
            console.log('getTotalCount处理函数执行了......')
            let total = this.list.reduce((sum,item)=> sum + item.num,0)
            return total
          }
       },
        computed:{ // 计算属性的配置项
            getCount(){ // getCount是计算属性的名称， 不是一个js函数
                console.log('getCount计算属性处理逻辑执行了......')
               // 属性计算出来之后，一定要return
               return this.list.reduce((sum,item)=> sum + item.num,0)
            }
        }
     })
</script>
</html>
