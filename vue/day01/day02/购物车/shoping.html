<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车</title>
    <link rel="stylesheet" href="style.css">
    <script src="/Users/caspian/cscodeProject/vue/day02/js/vue.js"></script>
</head>
<body>
    <div id="app">
        <!-- 商品展示区 -->
        <div class="container" style="margin-bottom: 20px;">
            <div class="header">
                <h1>商品列表</h1>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>图片</th>
                            <th>名称</th>
                            <th>单价</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="good in goods" :key="good.id">
                            <td>
                                <img :src="'img/' + good.image" alt="" width="40" height="40" style="border-radius:4px;">
                            </td>
                            <td>{{ good.name }}</td>
                            <td>¥ {{ good.price }}</td>
                            <td>
                                <button class="btn btn-primary" @click="addToCart(good)">加入购物车</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 购物车区 -->
        <div class="container">
            <div class="header">
                <h1>购物车</h1>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th><input type="checkbox" v-model="allChecked" @change="toggleAll"></th>
                            <th>图片</th>
                            <th>单价</th>
                            <th>个数</th>
                            <th>小计</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="(item, index) in cartItems" :key="item.id">
                            <td>
                                <input type="checkbox" class="checkbox" v-model="item.checked" @change="updateTotal">
                            </td>
                            <td>
                                <img :src="'img/' + item.image" alt="" width="40" height="40" style="border-radius:4px;">
                            </td>
                            <td>{{ item.price }}</td>
                            <td>
                                <div class="quantity-control">
                                    <button class="quantity-btn" @click="decrease(index)">-</button>
                                    <span>{{ item.count }}</span>
                                    <button class="quantity-btn" @click="increase(index)">+</button>
                                </div>
                            </td>
                            <td>{{ item.price * item.count }}</td>
                            <td>
                                <button class="btn btn-danger" @click="removeItem(index)">删除</button>
                            </td>
                        </tr>
                        <tr v-if="cartItems.length === 0">
                            <td colspan="6" style="text-align:center; padding:30px; color:#999;">🛒 购物车为空，请添加商品</td>
                        </tr>
                    </tbody>
                </table>
                <div class="total-bar">
                    <div>
                        <input type="checkbox" v-model="allChecked" @change="toggleAll">
                        <span> 全选</span>
                    </div>
                    <div>
                        总价：<span class="total-price">¥ {{ totalPrice }}</span>
                        <button class="btn btn-primary" @click="checkout">结算({{ selectedCount }})</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        new Vue({
            el: '#app',
            data: {
                goods: [
                    { id: 1, image: '火龙果.png', name: '火龙果', price: 6 },
                    { id: 2, image: '荔枝.png', name: '荔枝', price: 7 },
                    { id: 3, image: '榴莲.png', name: '榴莲', price: 15 },
                    { id: 4, image: '鸭梨.png', name: '鸭梨', price: 4 },
                    { id: 5, image: '樱桃.png', name: '樱桃', price: 12 },
                ],
            
                cartItems: JSON.parse(localStorage.getItem('cart')) || []
            },
            computed: {
                selectedCount() {
                    return this.cartItems.filter(item => item.checked).length;
                },
                totalPrice() {
                    return this.cartItems.filter(item => item.checked).reduce((sum, item) => sum + item.price * item.count, 0);
                },
                allChecked: {
                    get() {
                        if (this.cartItems.length === 0) return false;
                        return this.cartItems.every(item => item.checked);
                    },
                    set(value) {
                        this.cartItems.forEach(item => item.checked = value);
                    }
                }
            },
            watch: {
                cartItems: {
                    handler(newVal) {
                        localStorage.setItem('cart', JSON.stringify(newVal));
                    },
                    deep: true
                }
            },
            methods: {
                addToCart(good) {
                    const existing = this.cartItems.find(item => item.image === good.image);
                    if (existing) {
                        existing.count++;
                    } else {
                        this.cartItems.push({
                            id: Date.now(), 
                            image: good.image,
                            price: good.price,
                            count: 1,
                            checked: true
                        });
                    }
                },
                increase(index) {
                    this.cartItems[index].count++;
                },
                decrease(index) {
                    if (this.cartItems[index].count > 1) {
                        this.cartItems[index].count--;
                    }
                },
                removeItem(index) {
                    if (confirm('确定要删除该商品吗？')) {
                        this.cartItems.splice(index, 1);
                    }
                },
                toggleAll() {},
                checkout() {
                    if (this.selectedCount === 0) {
                        alert('请至少选择一件商品！');
                        return;
                    }
                    alert(`结算 ${this.selectedCount} 件商品，总价 ¥${this.totalPrice}`);
                }
            }
        });
    </script>
</body>
</html>
