<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .father {
          width: 200px;
          height: 200px;
          background-color: pink;
          margin-top: 20px;
        }
        .son {
          width: 100px;
          height: 100px;
          background-color: skyblue;
        }
      </style>
</head>
<body>
    <div id="app">
        <!-- 阻止事件的冒泡行为 -->
       <div class="father" @click="fatherFn">
        <div class="son" @click.stop="sonFn"></div>
       </div>

       <!-- 阻止事件的传播行为 -->
        <a @click.prevent href="http://www.baidu.com">阻止事件的传播行为</a>
    </div>
</body>
<script src="js/vue.js"></script>
<script>
   const vue = new Vue({
      el:"#app",
      data:{
       
      },
      methods:{
        fatherFn(){
            alert('父div被点击了')
        },
        sonFn(){
            alert('子div被点击了')
        }

      }
   })
</script>
</html>
