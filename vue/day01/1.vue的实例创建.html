<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
       创建vue实例的步骤:
         1. 准备div容器
         2. 引入vue.js核心库文件
         3. 创建vue实例
            通过el属性指定vue实例的挂载点
            通过data属性指定需要渲染的数据
         4. 在指定的区域定义配置项，完成数据的渲染
    -->
    <div id="app">
        <!-- 
            需要进行数据渲染的范围 {{}} 插值表达式 用来将data中数据渲染展示的一个语法结构
        -->
        {{msg}}
    </div>
</body>
<!-- 
   只有引入了vue.js的核心库文件，当前的html页面才具备vue的环境
-->
<script src="js/vue.js"></script>
<script>
    // 创建vue实例
    const vue = new Vue({
        // 通过el配置选择器,指定vue实例作用的范围
        el: '#app',
        // 准备数据，基于这些数据完成页面的渲染
        data:{
            msg:'hello,vue....'
        }
    })
</script>
</html>
