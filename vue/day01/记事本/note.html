<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记事本</title>
    <link rel="stylesheet" href="notepad.css">
   <script src="/Users/caspian/cscodeProject/vue/day01/js/vue.js"></script>
</head>
<body>
    <div id="app">
        <div class="container">
            <div class="header">
                <h1>记事本</h1>
            </div>
            
            <div class="input-section">
                <div class="input-group">
                    <input 
                        type="text" 
                        v-model="newNote" 
                        @keyup.enter="addNote"
                        id="noteInput" 
                        placeholder="输入新的记事..."
                    >
                    <button @click="addNote" id="addBtn">添加</button>
                </div>
            </div>
            
            <div class="list-section">
                <ul class="note-list" v-if="notes.length > 0">
                    <li 
                        class="note-item" 
                        v-for="(note, index) in notes" 
                        :key="note.id"
                    >
                        <span class="note-text">{{ note.text }}</span>
                        <button 
                            @click="deleteNote(index)" 
                            class="delete-btn"
                        >
                            删除
                        </button>
                    </li>
                </ul>
                <div v-else class="empty-state">
                    暂无记事内容
                </div>
            </div>
            
            <div class="footer">
                <div id="stats">共 {{ notes.length }} 条记事</div>
                <button @click="clearAllNotes" id="clearBtn">清空所有</button>
            </div>
        </div>
    </div>

    <script>
        new Vue({
            el: '#app',
            data: {
                newNote: '',
                notes: JSON.parse(localStorage.getItem('notes')) || []
            },
            watch: {
                notes: {
                    handler(newVal) {
                        localStorage.setItem('notes', JSON.stringify(newVal));
                    },
                    deep: true
                }
            },
            methods: {
            
                addNote() {
                    if (this.newNote.trim() === '') {
                        alert('请输入记事内容！');
                        return;
                    }
                    
                    const newNoteItem = {
                        id: Date.now(),
                        text: this.newNote.trim(),
                        timestamp: new Date().toISOString()
                    };
                    
                    this.notes.push(newNoteItem);
                    this.newNote = ''; 
                },
                
            
                deleteNote(index) {
                    if (confirm('确定要删除这条记事吗？')) {
                        this.notes.splice(index, 1);
                    }
                },
        
                clearAllNotes() {
                    if (this.notes.length === 0) {
                        alert('没有记事可以清空！');
                        return;
                    }
                    
                    if (confirm('确定要清空所有记事吗？此操作不可恢复！')) {
                        this.notes = [];
                    }
                }
            },
        
            mounted() {
                console.log('记事本应用已启动');
            }
        });
    </script>
</body>
</html>
