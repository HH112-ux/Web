<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- CSS only -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
    />
    <style>
      .red {
        color: red!important;
      }
      .search {
        width: 300px;
        margin: 20px 0;
      }
      .my-form {
        display: flex;
        margin: 20px 0;
      }
      .my-form input {
        flex: 1;
        margin-right: 20px;
      }
      .table > :not(:first-child) {
        border-top: none;
      }
      .contain {
        display: flex;
        padding: 10px;
      }
      .list-box {
        flex: 1;
        padding: 0 30px;
      }
      .list-box  a {
        text-decoration: none;
      }
      .echarts-box {
        width: 600px;
        height: 400px;
        padding: 30px;
        margin: 0 auto;
        border: 1px solid #ccc;
      }
      tfoot {
        font-weight: bold;
      }
      @media screen and (max-width: 1000px) {
        .contain {
          flex-wrap: wrap;
        }
        .list-box {
          width: 100%;
        }
        .echarts-box {
          margin-top: 30px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="contain">
        <!-- 左侧列表 -->
        <div class="list-box">

          <!-- 添加资产 -->
          <form class="my-form">
            <input type="text" v-model.trim="name" class="form-control" placeholder="消费名称" />
            <input type="text" v-model.number="price" class="form-control" placeholder="消费价格" />
            <button type="button" @click="add" class="btn btn-primary">添加账单</button>
          </form>

          <table class="table table-hover">
            <thead>
              <tr>
                <th>编号</th>
                <th>消费名称</th>
                <th>消费价格</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="(item,index) in list" :key="item.id">
                <td>{{ index + 1 }}</td>
                <td>{{ item.name }}</td>
                <td :class="{red : item.price > 10000 }">{{ item.price }}</td>
                <td ><a @click="del(item.id)" href="javascript:;">删除</a></td>
              </tr>
            </tbody>
            <tfoot>
              <tr>
                <td colspan="4">消费总计: {{ totalPrice }}</td>
              </tr>
            </tfoot>
          </table>
        </div>
        
        <!-- 右侧图表 -->
        <div class="echarts-box" id="main"></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
      /**
       * 功能需求：
       * 1. 基本渲染
       * 2. 添加功能
       * 3. 删除功能
       * 4. 饼图渲染
       */
      const app = new Vue({
        el: '#app',
        data: {
          name:'', // 账单名称
          price:0, // 账单价格
          list:[] // 接收后端查询的数据
        },
        computed:{
          totalPrice(){
            return this.list.reduce((sum,item)=> sum + item.price,0)
          }
        },
        methods:{
          // 查询账单信息
          async getList(){
             const res = await axios.get('http://localhost:3000/bill')
             this.list = res.data
             // 完成饼图中数据的动态填充
             this.mychart.setOption({
              series:[
                {
                  // map 将数组中的元素进行重新映射
                  data: this.list.map(item=>({value:item.price,name:item.name}))
                }
              ]
             })
          },

          // 添加账单信息
          async add(){
            // 非空判断
            if(!this.name){
              alert('请输入账单名称')
              return 
            }
            if(!this.price){
              alert('请输入账单价格')
              return
            }
            // 使用axios发送后端添加账单信息的请求
            await axios.post('http://localhost:3000/bill',{
              name: this.name,
              price: this.price,
              creator: '小明'
            })
            // 需要将账单信息重新查询一次
            this.getList()
            // 将页面上添加的内容清空
            this.name = ''
            this.price = ''
          },

          // 删除账单信息
          async del(id){
               await axios.delete(`http://localhost:3000/bill/${id}`)
               // 重新渲染账单列表
               this.getList()
          }
        },
        created(){
          this.getList() // 在页面一打开就立马执行数据的查询操作
        },
        mounted(){ // 初始化echarts实例对象
          this.mychart = echarts.init(document.querySelector('#main'))
          //给echarts实例对象指定配置项
          this.mychart.setOption({
            title: {
              text: '消费账单统计图',
              subtext: '账单消费明细',
              left: 'center'
            },
            tooltip: {
              trigger: 'item'
            },
            legend: {
              orient: 'vertical',
              left: 'left'
            },
            // 数据项
            series: [
              {
                name: '消费账单',
                type: 'pie',
                radius: '50%',
                data: [
                  /* { value: 1048, name: 'Search Engine' },
                  { value: 735, name: 'Direct' },
                  { value: 580, name: 'Email' },
                  { value: 484, name: 'Union Ads' },
                  { value: 300, name: 'Video Ads' } */
                ],
                emphasis: {
                  itemStyle: {
                    shadowBlur: 10,
                    shadowOffsetX: 0,
                    shadowColor: 'rgba(0, 0, 0, 0.5)'
                  }
                }
              }
            ]
          }
          )
        }
      })
    </script>
  </body>
</html>
